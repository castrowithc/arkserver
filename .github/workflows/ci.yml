name: CI

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Erzwingt den Basis-Image-Digest-Pin (Dockerfile) — Done-Kriterium Phase 7.
  verify-base-pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Assert base image is pinned by @sha256 digest
        run: |
          if ! grep -Eq '^FROM[[:space:]]+[^[:space:]]+@sha256:[0-9a-f]{64}' Dockerfile; then
            echo "::error file=Dockerfile::FROM muss per @sha256-Digest gepinnt sein"
            exit 1
          fi
          echo "Digest-Pin OK:"; grep -E '^FROM' Dockerfile

  build-scan:
    needs: verify-base-pin
    runs-on: ubuntu-latest
    permissions:
      contents: write         # GitHub-Release bei Tag-Push
      packages: write         # GHCR-Push (main + Version-Tags)
      security-events: write  # SARIF-Upload in den Security-Tab (public Repo)
    env:
      IMAGE: ghcr.io/${{ github.repository }}   # metadata-action lowercased automatisch
      SCAN_TAG: localbuild/arkserver:scan
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # :X.Y.Z + :X.Y bei Version-Tags, :latest folgt via Default-flavor den Releases;
          # :edge = Spitze von main; :sha-<short> je Commit.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=edge,branch=main
            type=sha,format=short

      # Bauen + lokal laden (load) fuer den Scan; noch KEIN Push.
      - name: Build image (load for scan)
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          load: true
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ env.SCAN_TAG }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            IMAGE_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 1) Report (immer gruen) -> SARIF fuer den Security-Tab (public Repo).
      - name: Trivy scan (SARIF report)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.SCAN_TAG }}
          scan-type: image
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          sarif_file: trivy-results.sarif

      # 2) Gate — Table ins Log + bei CRITICAL rot (unfixed CVEs ignoriert).
      - name: Trivy gate (fail on CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.SCAN_TAG }}
          scan-type: image
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      # 2b) Rauchtest — das Image muss startfaehig sein, nicht nur bauen und scannen. Faengt
      #     Fehler, die Build und Scan beide gruen passieren lassen: fehlendes Exec-Bit (0.1.0
      #     war so nicht startbar), kaputter Shebang, fehlgeschlagener gosu-Drop.
      - name: Smoke test (image starts)
        run: |
          IMG='${{ env.SCAN_TAG }}'
          # a) Jedes mitgelieferte Skript ist ausfuehrbar.
          docker run --rm --entrypoint sh "$IMG" -c '
            for f in /*.sh; do
              [ -x "$f" ] || { echo "nicht ausfuehrbar: $f"; exit 1; }
            done
            echo "Skript-Modi OK"'
          # b) Der Entrypoint laeuft wirklich an. Ohne bespieltes Volume begaenne danach der
          #    ~23-GB-Download, deshalb nur bis zum Startbanner warten und dann abbrechen.
          docker run -d --name smoke -e ARK_SERVER_VOLUME=/smoke "$IMG" >/dev/null
          for _ in $(seq 1 30); do
            if docker logs smoke 2>&1 | grep -q "RUNNING AS USER 'steam'"; then
              found=1; break
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' smoke)" != true ]; then break; fi
            sleep 2
          done
          docker logs smoke 2>&1 | head -20
          docker rm -f smoke >/dev/null
          [ "${found:-}" = 1 ] || { echo "Entrypoint ist nicht angelaufen"; exit 1; }

      # 3) Nur bei Push-Event (main-Branch oder Version-Tag), nach gruenem Gate: nach GHCR pushen.
      #    Cache-Hit -> praktisch nur Push, kein Rebuild. PRs pushen nicht.
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push to GHCR
        if: github.event_name == 'push'
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            IMAGE_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 4) Bei Version-Tag (vX.Y.Z): GitHub-Release mit auto-generierten Notes.
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes
