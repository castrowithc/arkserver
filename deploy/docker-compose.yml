# Hardened, self-hosted ARK: Survival Evolved dedicated server.
# Copy example.env -> .env in this directory, then run from here:
#   cp example.env .env && docker compose up -d
# Variable interpolation reads the .env next to this file (run compose from ./deploy).

volumes:
  ark-data:
  # Cluster only: shared transfer directory across cluster members. Uncomment to use,
  # and mount it at /cluster below. Not needed for a plain vanilla server.
  #ark-cluster:
  # Optional: persist SteamCMD's workshop/download cache (/home/steam/Steam) so mods are
  # not re-downloaded on every container recreate (#75). Recommended when using mods.
  #steam-home:

services:
  ark:
    container_name: ${COMPOSE_PROJECT_NAME:-ark}_server
    # Keep the server up across reboots/crashes, but not after an explicit `stop`.
    restart: unless-stopped
    # Cap the container log (Docker's json-file default is unbounded, so a chatty server
    # can fill the disk over time). This is the daemon-captured stdout/stderr; the in-game
    # log is a separate file, gated by ENABLE_GAME_LOG.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    # Published, CI-built + Trivy-scanned image from GHCR (recommended). Pin a fixed version
    # for production — easy rollback; :latest = newest release, :edge = tip of main. The
    # package is public, so no docker login is needed.
    image: ghcr.io/castrowithc/arkserver:0.1.1
    # To build the hardened image locally from source instead (context = repo root, one level
    # up), comment out `image:` above and uncomment the block below:
    #build:
    #  context: ..
    #  dockerfile: Dockerfile
    #image: arkserver:latest
    # Give the graceful-shutdown trap (broadcast -> saveworld -> backup) time to finish
    # before Docker sends SIGKILL. Raise for large worlds. (Phase 4 lifecycle.)
    stop_grace_period: 300s
    # Cap RAM (#85). ARK SE thrashes/livelocks below ~10 GB even on TheIsland (first
    # runtime test: 8g pinned the cgroup at the ceiling and the world never finished
    # loading). 12g is a safe floor for a small map; raise for big maps/many mods.
    # See ../arkserver-ops/server/docs/hardware-requirements.md.
    mem_limit: ${MEM_LIMIT:-12g}
    environment:
      # # This setup is necessary if you have to download a non-anonymous appID/modID
      #- STEAM_LOGIN=${STEAM_LOGIN}
      - SESSION_NAME=${SESSION_NAME}
      - SERVER_MAP=${SERVER_MAP}
      - SERVER_MAP_MOD_ID=${SERVER_MAP_MOD_ID:-}
      - SERVER_PASSWORD=${SERVER_PASSWORD}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - MAX_PLAYERS=${MAX_PLAYERS}
      - UPDATE_ON_START=${UPDATE_ON_START}
      - BACKUP_ON_STOP=${BACKUP_ON_STOP}
      - PRE_UPDATE_BACKUP=${PRE_UPDATE_BACKUP}
      - WARN_ON_STOP=${WARN_ON_STOP}
      - GAME_MOD_IDS=${GAME_MOD_IDS}
      # Launch flags (steam-entrypoint). BattlEye anti-cheat is ON by default; set
      # DISABLE_BATTLEYE=true to launch with -NoBattlEye. ENABLE_CROSSPLAY=true adds -crossplay.
      - DISABLE_BATTLEYE=${DISABLE_BATTLEYE:-}
      - ENABLE_CROSSPLAY=${ENABLE_CROSSPLAY:-}
      # Game log (chat/player events -> Saved/Logs/ShooterGame*.log) is OFF by default;
      # set true to launch with -servergamelog. The log is pruned count-based via cron.
      - ENABLE_GAME_LOG=${ENABLE_GAME_LOG:-}
      # File ownership on the bind/volume + inherited umask (Phase 3/4).
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - UMASK=${UMASK:-0002}
      # === Cluster (opt-in) ===
      # Set CLUSTER_ID to enable cross-server transfers (shared /cluster dir). Leave empty
      # for a plain vanilla server. SUB_INSTANCE_KEYS runs extra maps in THIS container;
      # each sub gets ports offset from the main instance (game +2, query +1, rcon +1 per
      # sub) — open the matching ranges below and see ../arkserver-ops/server/docs/mods-and-cluster.md.
      - CLUSTER_ID=${CLUSTER_ID:-}
      - SUB_INSTANCE_KEYS=${SUB_INSTANCE_KEYS:-}
      #- SUB_Fjordur_SERVER_MAP=Fjordur
      #- SUB_Fjordur_SERVER_MAP_MOD_ID=
    ports:
      # Port for connections from the ARK game client
      - "7777:7777/udp"
      # Raw UDP socket port (always game client port +1)
      - "7778:7778/udp"
      # Steam's server-list / query port
      - "27015:27015/udp"
      # RCON management port (TCP, optional — only expose if you use remote RCON)
      - "27020:27020/tcp"
      # Cluster only: open one extra block per sub-instance instead of the four lines above,
      # e.g. for 2 sub-instances: "7777-7781:7777-7781/udp", "27015-27017:27015-27017/udp",
      # "27020-27022:27020-27022/tcp".
    volumes:
      - ${ARK_SERVER_VOLUME:-ark-data}:/app
      # Optional: persist the SteamCMD workshop cache so mods survive container recreates
      # and aren't re-downloaded every start (#75). Uncomment with the steam-home volume
      # above. Also required for non-anonymous appID/modID downloads (set STEAM_LOGIN).
      #- steam-home:/home/steam/Steam
      # Cluster only: shared transfer dir. Uncomment together with the ark-cluster volume
      # above (or use a host path shared between cluster members across machines).
      #- ark-cluster:/cluster
    # Liveness probe (bin/healthcheck.sh). start_period covers the first-boot SteamCMD
    # download (~28 GB) + world load, which can take 20-40+ min; only then do failures
    # count. Restarts during this window are NOT penalised.
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 1800s
    networks:
      - default

  # Optional management panel (arkserver-panel), OFF by default. Start with:
  #   docker compose --profile panel up -d
  # Requires PANEL_USER/PANEL_PASS in .env. LAN-only: published on 127.0.0.1 by default —
  # change the host IP to your LAN address to reach it from other devices, or front it with a
  # reverse proxy. Remote access via VPN, never by exposing this port to the internet.
  panel:
    profiles: ["panel"]
    container_name: ${COMPOSE_PROJECT_NAME:-ark}_panel
    restart: unless-stopped
    # Same delivery as the server above: CI-built, Trivy-scanned, published to GHCR, and pinned to a
    # fixed version so a recreate never changes what runs (:latest = newest release, :edge = tip of
    # main). The package is public, so no docker login is needed. The pin sits in the .env because
    # the panel releases far more often than the server: a panel update is then an edit right where
    # `docker compose up -d` runs, instead of a change to this repository.
    image: ghcr.io/castrowithc/arkserver-panel:${PANEL_VERSION:-0.9.0}
    # Run as the server's own user. The config files on the volume are mode 600 and owned by it, so
    # with any other uid the panel could not even read them, let alone save an edit.
    user: "${PUID:-1000}:${PGID:-1000}"
    # Build locally from the sibling repo instead (dev layout):
    #build: ../../arkserver-panel
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - PANEL_ADDR=0.0.0.0:8080
      - PANEL_USER=${PANEL_USER:-}
      - PANEL_PASS=${PANEL_PASS:-}
      # RCON into the game server, for the player list and the restart action. Reuses the server's
      # own ADMIN_PASSWORD, so there is no second credential to keep in sync. The host is the
      # compose service alias, which survives a change of COMPOSE_PROJECT_NAME; the container name
      # would not. Without a password the panel still starts and reports these features as
      # unavailable.
      - ARK_RCON_ADDR=ark:27020
      - ARK_ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      # Where the volume below is mounted, so the panel can read the installed Steam build id and
      # edit the INIs. ARK_ENV_DIR is where this directory is mounted, for the read-only .env view.
      - ARK_DATA_DIR=/data
      - ARK_ENV_DIR=/deploy
      # Docker access for the CPU/RAM figures and for start/stop, always through the proxy below.
      # ARK_CONTAINER is the container's name as the Docker API knows it, which is not the service
      # alias RCON connects to. Empty ARK_DOCKER_HOST would simply hide those features.
      - ARK_DOCKER_HOST=http://socket-proxy:2375
      - ARK_CONTAINER=${COMPOSE_PROJECT_NAME:-ark}_server
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      # Same server volume: the panel reads and writes the INIs here.
      - ${ARK_SERVER_VOLUME:-ark-data}:/data
      # This directory, read-only, so the panel can show what the server was started with. Mounted
      # as a directory rather than as the single .env: a single-file mount pins an inode, so editing
      # the file on the host with anything that replaces it on save would leave the panel showing
      # the old content indefinitely.
      - ./:/deploy:ro
    networks:
      - default

  # Docker access for the panel, narrowed to a fixed set of paths on the ARK container. Same profile
  # as the panel, so neither runs in normal operation. The panel speaks plain HTTP to this proxy and
  # never gets the socket: socket access is always full access, and the panel is the part with a web
  # UI and therefore the attack surface. Not published on any port, so only the compose network can
  # reach it.
  socket-proxy:
    profiles: ["panel"]
    container_name: ${COMPOSE_PROJECT_NAME:-ark}_socket_proxy
    restart: unless-stopped
    # Pinned by digest (index digest, so every architecture still resolves).
    image: wollomatic/socket-proxy:1.12.3@sha256:74e770f5ed3cfc9ecb6350e177d2aa55873568c85bc953079834e68607dbf71b
    # Reading the Docker socket needs root, and as a non-root user the proxy exits at startup. This
    # is exactly why it is its own minimal container: the privilege sits here, in a from-scratch
    # image with no shell, instead of in the panel.
    user: "0:0"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # The allowlist is the real gate: exactly the paths the panel calls, bound to this deployment's
    # ARK container. Everything else, other containers, images, networks, exec, and even kill on the
    # ARK container itself, comes back 403. Each regex is anchored by the proxy.
    command:
      - "-loglevel=info"
      - "-listenip=0.0.0.0"
      - "-allowfrom=panel"
      - "-allowGET=/containers/${COMPOSE_PROJECT_NAME:-ark}_server/(json|stats)"
      - "-allowPOST=/containers/${COMPOSE_PROJECT_NAME:-ark}_server/(start|stop)"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - default
